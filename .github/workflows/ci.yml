name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` lets a PR opt into macOS by adding the `macos-ci` label.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Group by commit, not ref: a push and its pull_request event for the same
  # commit share a group, so only one run consumes macOS minutes.
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Linux / MarkdownCore
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Verify MarkdownCore is Foundation-only
        run: ./scripts/check-core-imports.sh

      - name: Run core tests
        run: swift test

  macos-app:
    name: macOS / MarkdownNotepad
    # macOS runners bill at 10x and included minutes are exhausted. Keep them
    # off ordinary pushes and PRs: run only on manual dispatch or when a PR is
    # explicitly labeled `macos-ci`.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'macos-ci'))
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Run core tests on macOS (Darwin file paths)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            app/.derivedData
            .build
          key: ${{ runner.os }}-xcode-${{ hashFiles('Package.swift', 'Package.resolved', 'app/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml

      - name: Build app
        run: |
          xcodebuild \
            -project app/MarkdownNotepad.xcodeproj \
            -scheme MarkdownNotepad \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath app/.derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify app icon integration
        run: |
          app="$(find app/.derivedData/Build/Products/Debug -maxdepth 1 -type d -name 'MarkdownNotepad.app' -print -quit)"
          test -n "$app"
          ./scripts/verify-app-icon.sh "$app"

      - name: Verify Markdown document registration
        env:
          EVIDENCE_FILE: ${{ github.workspace }}/app/document-type-verification.md
        run: |
          ./scripts/verify-document-types.sh \
            "app/.derivedData/Build/Products/Debug/MarkdownNotepad.app"

      - name: Prepare RYA-16 launch-with-file fixture
        run: |
          mkdir -p /tmp/markdown-notepad-rya16
          printf '# Opened from Finder\n\nBody text\n' > /tmp/markdown-notepad-rya16/opened.md

      - name: Run internal acceptance rehearsal (XCUITest)
        env:
          SCREENSHOT_DIR: ${{ github.workspace }}/app/.ui-screenshots
          ICON_EVIDENCE_APP: ${{ github.workspace }}/app/.derivedData/Build/Products/Debug/MarkdownNotepad.app
          TEST_RUNNER_SCREENSHOT_DIR: ${{ github.workspace }}/app/.ui-screenshots
          TEST_RUNNER_ICON_EVIDENCE_APP: ${{ github.workspace }}/app/.derivedData/Build/Products/Debug/MarkdownNotepad.app
        run: |
          set -o pipefail
          rm -rf app/TestResults.xcresult
          xcodebuild test \
            -project app/MarkdownNotepad.xcodeproj \
            -scheme MarkdownNotepad \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath app/.derivedData \
            -resultBundlePath app/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee app/xcodebuild-test.log

      - name: Confirm icon evidence ran in the single UI suite
        if: always()
        run: grep -q "test08AppIconInDockAndFinder.*passed" app/xcodebuild-test.log

      - name: Export UI-test screenshots
        if: always()
        run: |
          mkdir -p app/.ui-screenshots
          # The UI-test runner is sandboxed, so screenshots land in its own
          # container temp directory; copy them into the checkout for upload.
          find "$HOME/Library/Containers" -type f \
            -path '*MarkdownNotepadScreenshots/*.png' \
            -exec cp {} app/.ui-screenshots/ \; 2>/dev/null || true
          if command -v xcparse >/dev/null 2>&1; then
            xcparse screenshots app/TestResults.xcresult app/.ui-screenshots || true
          fi
          ls -1 app/.ui-screenshots | head -30

      - name: Generate acceptance rehearsal report
        if: always()
        run: |
          python3 scripts/acceptance-report.py \
            app/xcodebuild-test.log \
            app/acceptance-rehearsal.md

      - name: Upload UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-ui-test-artifacts
          path: |
            app/TestResults.xcresult
            app/xcodebuild-test.log
            app/document-type-verification.md
            app/acceptance-rehearsal.md
            app/.ui-screenshots
            /tmp/markdown-notepad-ui-screenshots
          if-no-files-found: warn
          include-hidden-files: true
