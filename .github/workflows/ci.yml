name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    name: Linux / MarkdownCore
    runs-on: ubuntu-latest
    container: swift:6.2
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: .build
          key: ${{ runner.os }}-swift-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-

      - name: Verify MarkdownCore is Foundation-only
        run: ./scripts/check-core-imports.sh

      - name: Run core tests
        run: swift test

  macos-app:
    name: macOS / MarkdownNotepad
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache SwiftPM and DerivedData
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            app/.derivedData
          key: ${{ runner.os }}-xcode-${{ hashFiles('Package.swift', 'Package.resolved', 'app/project.yml') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Generate Xcode project
        run: xcodegen generate --spec app/project.yml

      - name: Build app
        run: |
          xcodebuild \
            -project app/MarkdownNotepad.xcodeproj \
            -scheme MarkdownNotepad \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath app/.derivedData \
            CODE_SIGNING_ALLOWED=NO \
            build
