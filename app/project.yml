name: MarkdownNotepad
options:
  bundleIdPrefix: com.ryanpaperclip
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.4"
  projectFormat: xcode15_0
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  MarkdownCore:
    path: ..

settings:
  base:
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  MarkdownNotepad:
    type: application
    platform: macOS
    sources:
      - path: MarkdownNotepad
        excludes:
          - Info.plist
    dependencies:
      - package: MarkdownCore
        product: MarkdownCore
      - package: MarkdownCore
        product: MarkdownPreview
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpaperclip.markdownnotepad
        PRODUCT_NAME: MarkdownNotepad
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MarkdownNotepad/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_EMIT_LOC_STRINGS: YES

  MarkdownNotepadUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MarkdownNotepadUITests
    dependencies:
      - target: MarkdownNotepad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanpaperclip.markdownnotepad.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: MarkdownNotepad
        SWIFT_VERSION: "5.9"

schemes:
  MarkdownNotepad:
    build:
      targets:
        MarkdownNotepad: all
        MarkdownNotepadUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MarkdownNotepadUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
